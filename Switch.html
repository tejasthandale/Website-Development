<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Switch</title>
</head>
<body>
    <p id="demo"></p>
    <script>
        var day; 
        switch (new Date().getDay()) {
            case 0:
            day = "Sunday";
            break;
            case 1:
         day = "Monday";
         School;
          case 2:
            day = "Tuesday";
             School;  
            case 3:
            day = "Wednesday";
            School;
            case 4:
                day = "Thursday";
                School;
                case 5:
                    day = "Friday";
                    School;  
                    case 6:
                        day = "Saturday";
                        Break;
        }
        document.getElementById("demo").innerHTML = "Today is " + day;

    </script>
</body>
</html>
