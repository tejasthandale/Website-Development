<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Hobby Card</title>
    
    <link rel="stylesheet"

href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
<style>
        body{
            background-color: crimson;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            color: rgb(239, 199, 199);
            padding: 10px 10px;

        }
        h1{
            text-align: center;
            color: cornflowerblue;
            font-weight: bold;
        }
        .Hobby-card{
            text-align: center;
            border: 4px solid cyan;
            padding: 30px;
            border-radius: 8px ;
            background-color: rgb(0, 105, 180);
            margin-bottom: 20px;

        }
        .Hobby-card h3{
            color: cornflowerblue;
            font-size: 35px
        }
        
    </style>
</head>
<body>
    <h1>My Hobby Card</h1>
    <div class="container">
        <div class="row">
            <div class="col-12 col-md-6 col-lg-4 ">
                <div class="Hobby-card">
                    <h3>Drawing</h3>
                    <p>I loving sketching animals and comic book characters.</p>
                </div>
            </div>
             <div class="col-12 col-md-6 col-lg-4 ">
                <div class="Hobby-card">
                    <h3>Football</h3>
                    <p>I play football every evening with my friends.</p>
                </div>
            </div>
             <div class="col-12 col-md-6 col-lg-4 ">
                <div class="Hobby-card">
                    <h3>Reading</h3>
                    <p>My favorite book genres are adventure and fictions.</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
