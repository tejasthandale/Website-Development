<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Methods</title>
</head>
<body>
 <h2>Basic Methods</h2>
 <p>Basic methods are functions that belong to an object.</p>
 <script>
    var str = "AmAzInG";
    document.write(str.toUpperCase());
    document.write("<br>");
    document.write(str.toLowerCase());
    document.write("<br>");
    document.write(str.startsWith('i'));
    document.write("<br>");

    var str1 = "I learnt about Methods";
    var patt = new RegExp("about");
    var res = patt.test(str1);
    document.write(res);


 </script>
</body>
</html>
